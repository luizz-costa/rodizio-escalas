<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funcionários | Gestão de Escalas</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="conteudo">
    <h1>Funcionários</h1>
    <p class="aviso" id="aviso" hidden></p>

    <section class="painel">
      <h2 id="titulo-form">Novo funcionário</h2>
      <form id="formulario" class="formulario" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" autocomplete="off">
          <span class="erro-campo" data-erro="nome"></span>
        </div>
        <div class="campo">
          <label for="matricula">Matrícula</label>
          <input id="matricula" autocomplete="off">
          <span class="erro-campo" data-erro="matricula"></span>
        </div>
        <div class="campo">
          <label for="cargo">Cargo</label>
          <input id="cargo" autocomplete="off">
          <span class="erro-campo" data-erro="cargo"></span>
        </div>
        <div class="campo">
          <label for="escala">Escala</label>
          <select id="escala"></select>
          <span class="erro-campo" data-erro="escalaid"></span>
        </div>
        <div class="campo">
          <label for="antiguidade">Antiguidade</label>
          <input id="antiguidade" type="number" min="1">
          <span class="erro-campo" data-erro="antiguidade"></span>
        </div>
        <fieldset class="campo">
          <legend>Dias em que pode cumprir serviço</legend>
          <div class="opcoes" id="dias"></div>
        </fieldset>
        <div class="acoes">
          <button type="submit" id="salvar">Cadastrar</button>
          <button type="button" class="secundario" id="cancelar" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel">
      <div class="cabecalho-painel">
        <h2>Cadastrados</h2>
        <div class="campo">
          <label for="filtro">Escala</label>
          <select id="filtro"></select>
        </div>
      </div>
      <div class="rolagem">
        <table>
          <thead>
            <tr>
              <th>Nome</th><th>Matrícula</th><th>Cargo</th><th>Escala</th>
              <th class="numero">Antig.</th><th>Pode servir</th><th>Situação</th><th></th>
            </tr>
          </thead>
          <tbody id="linhas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/funcionarios.js"></script>
</body>
</html>
